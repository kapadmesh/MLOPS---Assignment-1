services:
  api:
    image: heart-disease-api:stage06
    build:
      context: ../..
      dockerfile: stages/stage_06_model_containerization/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL